name: API
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: gestion_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d gestion_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/gestion_test
      PORT: 3000
      ADMIN_EMAIL: ci@example.com
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Credenciales efímeras de pruebas
        run: |
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "ADMIN_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - run: npm run test:e2e
      - name: Integración con PostgreSQL
        run: |
          node dist/main.js > /tmp/gestion-api.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID"' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://localhost:3000/health; then break; fi
            sleep 2
          done
          npm run test:integration
